name: Public Core CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROYAL_RUNTIME_MODE: demo
      ROYAL_PROFILE_JSON: ''
      ROYAL_PROFILE_PATH: ''
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          find scripts tests -type f -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Run deterministic Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check decision/history module syntax
        run: node --check src/decision-history.mjs

      - name: Run decision/history semantic tests
        run: node --test tests/test_decision_history.mjs

      - name: Enforce current-tree public-data boundary
        run: python3 scripts/validate_public_boundary.py

      - name: Enforce reachable-history public-data boundary
        run: python3 scripts/validate_public_history.py

      - name: Check Cloudflare JavaScript syntax
        run: node --check cloudflare/scheduler-wake.js

      - name: Run pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          dest="$RUNNER_TEMP/actionlint-bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          mkdir -p "$dest"
          tar -xzf "$archive" -C "$dest"
          "$dest/actionlint" -color

      - name: Scan reachable HEAD history with pinned Betterleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks_1.8.1_linux_x64.tar.gz"
          dest="$RUNNER_TEMP/betterleaks-bin"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz" -o "$archive"
          echo "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  $archive" | sha256sum -c -
          mkdir -p "$dest"
          tar -xzf "$archive" -C "$dest"
          betterleaks_bin="$(find "$dest" -type f -name betterleaks -print -quit)"
          test -n "$betterleaks_bin"
          chmod +x "$betterleaks_bin"
          "$betterleaks_bin" git . --log-opts="HEAD" --redact --no-banner --no-color

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check -r --root HEAD
          fi
